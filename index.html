<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Prajwal!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg: #0b0c10;
    --panel: #14161c;
    --gold: #c9a24b;
    --gold-soft: #e4c987;
    --text: #ece9e2;
    --muted: #9a9ba3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #1a1d26 0%, var(--bg) 65%);
    color: var(--text);
    padding: 32px 16px;
    position: relative;
    overflow: hidden;
  }

  .spark {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--gold-soft);
    border-radius: 50%;
    opacity: 0;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translateY(0) translateX(0); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-90vh) translateX(20px); }
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, var(--panel), #101218);
    border: 1px solid rgba(201, 162, 75, 0.35);
    border-radius: 4px;
    padding: 56px 44px;
    text-align: center;
    box-shadow: 0 40px 80px rgba(0,0,0,0.55);
    animation: rise-in 0.9s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .rule {
    width: 56px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 22px;
    opacity: 0.8;
  }

  .eyebrow {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  h1 span {
    display: block;
    color: var(--gold-soft);
    font-style: italic;
    font-weight: 500;
    font-size: 44px;
    margin-top: 6px;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,75,0.5), transparent);
    margin: 26px 0;
  }

  p.message {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    line-height: 1.75;
    color: #d6d3ca;
    margin: 0 0 30px;
    font-style: italic;
  }

  .signature {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .signature strong {
    display: block;
    margin-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-style: normal;
    text-transform: none;
    letter-spacing: 0.02em;
    font-size: 18px;
    color: var(--gold-soft);
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">A Toast, To My Brother</div>
  <div class="rule"></div>
  <h1>Happy Birthday my brother<span>Prajwal Devulapally</span></h1>
  <div class="divider"></div>
  <p class="message">Another year, another milestone earned — not given. Here's to the man you've become, and the one you're still becoming. Proud to call you my brother.</p>
  <div class="signature">With respect and love<strong>Your Sibling</strong></div>
</div>

<script>
  const body = document.body;
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.bottom = '-10px';
    s.style.animationDuration = (7 + Math.random() * 8) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    body.appendChild(s);
  }
</script>

</body>
</html>
